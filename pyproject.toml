[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-link-lab"
version = "0.4.0"
description = "An explainable RF telemetry and fault-diagnosis learning workbench"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.5,<2", "PySide6-Essentials>=6.7,<7", "pyserial>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
rf-link-lab = "rf_link_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

